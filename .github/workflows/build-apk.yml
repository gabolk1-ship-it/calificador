name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: calificador-derecho-apk
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.4.4-apk
        name: "Calificador Android v1.4.4 (APK)"
        body: |
          ### Calificador de Derecho a Salud (IESS / MSP) - Android APK v1.4.4
          - Calificación por Fecha: Permite auditar y verificar derechos a fechas pasadas de atención tanto en modo individual como masivo.
          - Detección automática de columnas de fecha (Excel, CSV) y formato con fecha por fila (ej. `1710034065, 15/05/2024`).
          - Selector global de fecha para lotes masivos con opción de calificar al día de hoy.
          - Modo de pacientes únicos predeterminado con desglose estadístico claro del total de filas y duplicados removidos.
          - Clasificación detallada del Seguro: CA (Jefe de familia / Titular Campesino), CB (Beneficiario Campesino), JUB-SSC, SG.
          - Exportación Excel con columna 'Fecha Calificada'.
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
