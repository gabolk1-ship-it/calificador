name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: calificador-derecho-apk
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.1.0-apk
        name: "Calificador Android v1.1.0 (APK)"
        body: |
          ### Calificador de Derecho a Salud (IESS / MSP) - Android APK
          - Lectura nativa de C?dula Electr?nica por **NFC** (ISO-DEP / ICAO 9303).
          - Esc?ner ?ptico integrado con c?mara (PDF417 / QR).
          - Consulta instant?nea y unificada de derechos.
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
