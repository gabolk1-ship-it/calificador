name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: calificador-derecho-apk
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.4.1-apk
        name: "Calificador Android v1.4.1 (APK)"
        body: |
          ### Calificador de Derecho a Salud (IESS / MSP) - Android APK v1.4.1
          - Escáner óptico optimizado para celulares: autoenfoque continuo HD, controles de zoom rápido (1x, 1.5x, 2x, 3x) y selector de lentes traseros (evita apertura en gran angular lejano).
          - Decodificación robusta para códigos PDF417 de alta densidad y códigos Code 39 / Code 128 de cédulas tradicionales.
          - Adaptación nativa al viewport móvil en WebView y diseño de cámara responsivo sin franjas reducidas.
          - Selector nativo de archivos para Carga Masiva (Excel, CSV, TXT) desde cualquier carpeta del teléfono.
          - Lector Externo de Código de Barras (USB / Bluetooth / Pistola).
          - Detección y lectura de Cédula por NFC (ISO-DEP / ICAO 9303).
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
